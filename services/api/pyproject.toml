[project]
name = "wealthpilot-api"
version = "1.0.0"
description = "WealthPilot API: FastAPI modular monolith + Postgres-backed job worker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "wealthpilot-calc",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30,<2.1",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    "reportlab>=4.2",
    "boto3>=1.34",
]

[dependency-groups]
dev = ["pytest>=8", "pypdf>=4.3", "ruff>=0.6", "pytest-cov>=5"]

[tool.uv.sources]
wealthpilot-calc = { path = "../../packages/calculation_engine", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wealthpilot_api"]

# Vercel (Python runtime, FastAPI preset). Dependencies install from uv.lock (`uv sync --no-editable`), which
# builds the ../../packages/calculation_engine path dependency into the bundle; the build script validates the
# configuration and runs migrations. See README "Deploying to Vercel".
[tool.vercel]
entrypoint = "index:app"

[tool.vercel.scripts]
build = "python scripts/vercel_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:reportlab.*", "ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM108", "B008", "RUF012"]
